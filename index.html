<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manip-Rx - Application Mobile</title>
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="style.css">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        
        <!-- قسم التحميل رئيسي -->
        <div class="section-card hero-card">
            <div class="badge">Application Android</div>
            <h1>Plateforme Manip-Rx</h1>
            <p>Pour télécharger l'application, cliquez sur le bouton ci-dessous :</p>
            
            <a href="ManipRx.apk" class="btn-download" id="downloadBtn" download>
                <i class="fa-solid fa-download"></i>
                <span>Télécharger l'application (APK)</span>
            </a>
            <div id="downloadNotice" class="download-notice"></div>
        </div>

        <!-- البطاقة الأولى - صورة الواجهة -->
        <div class="section-card">
            <h2><i class="fa-solid fa-house-medical"></i> Accueil de l'application</h2>
            <div class="image-wrapper">
                <img src="https://img.sanishtech.com/u/c34a15752caf96a34da0edad83185429.png" alt="Accueil Manip-Rx" class="preview-img">
            </div>
        </div>

        <!-- البطاقة الثانية - صورة Incidences -->
        <div class="section-card">
            <h2><i class="fa-solid fa-x-ray"></i> Les Incidences</h2>
            <div class="image-wrapper">
                <img src="https://img.sanishtech.com/u/c28ad28843ef0f0717f2157e38c5c478.png" alt="Les Incidences" class="preview-img">
            </div>
        </div>

        <!-- البطاقة الثالثة - صورة Cours -->
        <div class="section-card">
            <h2><i class="fa-solid fa-graduation-cap"></i> Les Cours</h2>
            <div class="image-wrapper">
                <img src="https://img.sanishtech.com/u/58d6dc07b4e715eaccb78cd9d549f875.png" alt="Les Cours" class="preview-img">
            </div>
        </div>

        <footer>
            <p>&copy; Manip-Rx - Tous droits réservés</p>
        </footer>

    </div>

    <!-- نافذة المكبر عند الضغط على الصورة (Lightbox) -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg" alt="Agrandissement">
    </div>

    <!-- ربط ملف JavaScript الخارجي -->
    <script src="script.js"></script>
</body>
</html>
