<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق Manip-Rx</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        h1 {
            color: #1f2937;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .download-btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>تطبيق Manip-Rx</h1>
        <p>اضغط على الزر أدناه لبدء تحميل ملف الـ APK مباشرة على هاتفك.</p>
        
        <!-- تم تعديل الرابط ليكون ManipRx.apk بالضبط ليطابق اسم الملف المرفوع -->
        <a href="ManipRx.apk" class="download-btn" download>تحميل التطبيق (APK)</a>
    </div>

</body>
</html>
