<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manip-Rx - Application Mobile</title>
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <!-- القسم الأول: زر التحميل -->
        <div class="section-card">
            <h1>Plateforme Manip-Rx</h1>
            <p>Pour télécharger l'application, cliquez sur le bouton ci-dessous :</p>
            <a href="ManipRx.apk" class="btn-download" download>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Télécharger l'application (APK)
            </a>
        </div>

        <!-- القسم الثاني: الصورة الأولى منفصلة -->
        <div class="section-card">
            <h2>Accueil de l'application</h2>
            <div class="single-image-container">
                <img src="1000346643.png" alt="Aperçu 1">
            </div>
        </div>

        <!-- القسم الثالث: الصورة الثانية منفصلة -->
        <div class="section-card">
            <h2>Les Incidences</h2>
            <div class="single-image-container">
                <img src="1000346646.png" alt="Aperçu 2">
            </div>
        </div>

        <!-- القسم الرابع: الصورة الثالثة منفصلة -->
        <div class="section-card">
            <h2>Les Cours</h2>
            <div class="single-image-container">
                <img src="1000346647.png" alt="Aperçu 3">
            </div>
        </div>

        <footer>
            <p>&copy; Manip-Rx - Tous droits réservés</p>
        </footer>

    </div>

</body>
</html>
